name: Build C-Dogs Android RP5

on:
  workflow_dispatch:
  push:
    branches:
      - android-rp5
    paths:
      - 'android/**'
      - 'src/**'
      - 'data/**'
      - 'graphics/**'
      - 'sounds/**'
      - 'music/**'
      - '.github/workflows/android-rp5.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android packages
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0' 'ndk;27.2.12479018' 'cmake;3.22.1'

      - name: Bootstrap Android project
        run: bash android/bootstrap.sh

      - name: Build arm64 debug APK
        working-directory: android/project
        run: ./gradlew --no-daemon assembleDebug

      - name: Collect APK
        run: |
          mkdir -p out
          cp android/project/app/build/outputs/apk/debug/app-debug.apk out/cdogs-rp5-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: cdogs-rp5-debug
          path: out/cdogs-rp5-debug.apk
          if-no-files-found: error
