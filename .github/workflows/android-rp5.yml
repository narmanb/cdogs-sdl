name: Build C-Dogs Android RP5

on:
  workflow_dispatch:
  push:
    branches:
      - android-rp5
    paths:
      - 'CMakeLists.txt'
      - 'android/**'
      - 'src/**'
      - 'data/**'
      - 'graphics/**'
      - 'sounds/**'
      - 'music/**'
      - '.github/workflows/android-rp5.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android packages
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0' 'ndk;27.2.12479018' 'cmake;3.31.6'

      - name: Bootstrap Android project
        run: bash android/bootstrap.sh

      - name: Build arm64 debug APK
        working-directory: android/project
        run: ./gradlew --no-daemon assembleDebug

      - name: Collect APK
        run: |
          mkdir -p out
          cp android/project/app/build/outputs/apk/debug/app-debug.apk out/cdogs-rp5-debug.apk

      - name: Validate Android startup payload
        run: |
          set -euo pipefail
          APK=out/cdogs-rp5-debug.apk
          unzip -l "$APK" | tee out/apk-contents.txt

          for required in \
            lib/arm64-v8a/libSDL2.so \
            lib/arm64-v8a/libSDL2_mixer.so \
            lib/arm64-v8a/libmain.so \
            assets/graphics/font.png \
            assets/data/ammo.json; do
            grep -Fq "$required" out/apk-contents.txt || {
              echo "Missing required APK payload: $required" >&2
              exit 1
            }
          done

          rm -rf out/apk-check
          mkdir -p out/apk-check
          unzip -q "$APK" 'lib/arm64-v8a/libmain.so' -d out/apk-check
          MAIN_SO=out/apk-check/lib/arm64-v8a/libmain.so
          READELF="$ANDROID_SDK_ROOT/ndk/27.2.12479018/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-readelf"

          "$READELF" -Ws "$MAIN_SO" | tee out/libmain-symbols.txt
          grep -Eq '[[:space:]]SDL_main$' out/libmain-symbols.txt || {
            echo 'libmain.so does not export SDL_main' >&2
            exit 1
          }
          grep -Eq '[[:space:]]main$' out/libmain-symbols.txt || {
            echo 'libmain.so does not contain the real C-Dogs main entry point' >&2
            exit 1
          }

          "$READELF" -d "$MAIN_SO" | tee out/libmain-dynamic.txt
          grep -Fq '[libSDL2.so]' out/libmain-dynamic.txt || {
            echo 'libmain.so does not depend on SDL2' >&2
            exit 1
          }
          grep -Fq '[libSDL2_mixer.so]' out/libmain-dynamic.txt || {
            echo 'libmain.so does not depend on SDL2_mixer' >&2
            exit 1
          }

          strings "$MAIN_SO" | grep -Fq 'launching real C-Dogs main' || {
            echo 'libmain.so is missing the real-startup Android bridge' >&2
            exit 1
          }

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: cdogs-rp5-debug
          path: out/cdogs-rp5-debug.apk
          if-no-files-found: error
