plugins {
    id 'com.android.application'
}

android {
    namespace 'com.narmanb.cdogs'
    compileSdk 35
    ndkVersion '27.2.12479018'

    defaultConfig {
        applicationId 'com.narmanb.cdogs'
        minSdk 23
        targetSdk 35
        versionCode 1
        versionName '2.4.0-rp5-dev1'
        ndk {
            abiFilters 'arm64-v8a'
        }
        externalNativeBuild {
            cmake {
                arguments '-DANDROID_STL=c++_shared'
            }
        }
    }

    externalNativeBuild {
        cmake {
            path file('jni/CMakeLists.txt')
            version '3.31.6'
        }
    }

    sourceSets.main {
        jniLibs.srcDir 'libs'
    }

    buildTypes {
        debug { debuggable true }
        release {
            minifyEnabled false
            signingConfig signingConfigs.debug
        }
    }
}
